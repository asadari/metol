<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Korean NXUI uses a renamed SIL OFL Noto Sans CJK KR subset.
     Keep its directory separate from the legacy Chinese font to avoid scanning
     both on every launch. Camera startup timing still needs device validation.
     This configuration only applies to NXUI, not the camera's native menus. -->
<fontconfig>
  <dir>/opt/usr/nx-ks/nxui/fonts-ko</dir>
  <cachedir>/mnt/mmc/nxui/fc-cache</cachedir>
</fontconfig>
